<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#eceef4">
  <title>確認結果 — 日本記帳</title>
  <link rel="stylesheet" href="style.css">
  <script src="js/theme.js"></script>
</head>
<body>
<div class="page">

  <!-- Header -->
  <div class="page-header">
    <a href="scan.html" class="back-btn">←</a>
    <div style="flex:1;padding-left:12px;">
      <div class="page-title">確認記帳資訊</div>
      <div class="page-subtitle">AI 辨識結果，可以手動修改</div>
    </div>
  </div>

  <!-- AI Badge -->
  <div style="margin-bottom:12px;">
    <span class="ai-badge">✦ AI 辨識完成</span>
  </div>

  <!-- Amount Hero -->
  <div class="amount-hero">
    <div class="amount-jpy-big">
      <span class="yen-sign">¥</span><span id="displayJPY">0</span>
    </div>
    <div class="amount-twd-conv" id="displayTWD">≈ NT$0</div>
  </div>

  <!-- Editable Header Fields -->
  <div class="field-group">

    <!-- Store Name -->
    <div class="field-row">
      <label>店名</label>
      <input class="form-input" id="fStoreName" type="text" placeholder="店名（繁體中文）">
    </div>
    <div class="field-row">
      <label>日文</label>
      <input class="form-input" id="fStoreNameJa" type="text" placeholder="店名（日文原文）">
    </div>

    <!-- Amount -->
    <div class="field-row">
      <label>總金額</label>
      <input class="form-input" id="fAmountJPY" type="number" min="0" placeholder="收據總金額 (JPY)">
    </div>

  </div>

  <!-- Category + Payment + Tax + Date -->
  <div class="field-group">

    <div class="field-row">
      <label>類別</label>
      <select class="form-input form-select" id="fCategory">
        <option>餐飲</option>
        <option>交通</option>
        <option>購物</option>
        <option>門票</option>
        <option>住宿</option>
        <option>藥品</option>
        <option>其他</option>
      </select>
    </div>

    <div class="field-row">
      <label>付款</label>
      <select class="form-input form-select" id="fPayment">
        <option>現金</option>
        <option>信用卡</option>
        <option>Suica</option>
        <option>PayPay</option>
        <option>其他</option>
      </select>
    </div>

    <div class="field-row">
      <label>稅制</label>
      <select class="form-input form-select" id="fTaxType">
        <option>内税</option>
        <option>外税</option>
        <option>免税</option>
        <option>不明</option>
      </select>
    </div>

    <div class="field-row">
      <label>日期</label>
      <input class="form-input" id="fDate" type="date">
    </div>

  </div>

  <!-- Detailed Line Items (表身商品明細) -->
  <div class="card" style="padding:16px;margin-bottom:12px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
      <div style="font-size:13px;font-weight:700;color:var(--secondary);letter-spacing:0.5px;">
        📋 收據品項明細（表身）
      </div>
      <button type="button" class="btn btn-ghost btn-sm" id="btnAddItem" style="padding:4px 10px;font-size:12px;">
        + 新增品項
      </button>
    </div>
    
    <div id="itemsContainer" style="display:flex;flex-direction:column;gap:10px;"></div>
  </div>

  <!-- Notes -->
  <div class="form-group">
    <label class="form-label">備註</label>
    <input class="form-input" id="fNotes" type="text" placeholder="稅制說明、折扣資訊等（選填）">
  </div>

  <!-- TWD Preview -->
  <div style="
    background:var(--bg-card);border:1px solid var(--border-light);
    border-radius:var(--r-md);padding:12px 16px;margin-bottom:16px;
    display:flex;align-items:center;justify-content:space-between;">
    <span style="font-size:13px;color:var(--text-secondary);">換算台幣</span>
    <span style="font-size:16px;font-weight:700;" id="twdPreview">NT$0</span>
  </div>

  <!-- Save / Cancel -->
  <div style="display:flex;flex-direction:column;gap:10px;padding-bottom:8px;">
    <button class="btn btn-primary btn-full" id="btnSave" style="font-size:16px;padding:17px;">
      💾 儲存記錄
    </button>
    <a href="scan.html" class="btn btn-ghost btn-full" style="font-size:14px;">
      重新掃描
    </a>
  </div>

</div>

<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script>
let itemsData = [];

document.addEventListener('DOMContentLoaded', () => {
  renderNav('scan');

  const data = Session.get('scanResult');
  if (!data) {
    showToast('沒有找到辨識結果，請重新掃描', 'error');
    setTimeout(() => { window.location.href = 'scan.html'; }, 1500);
    return;
  }

  const settings = Storage.getSettings();

  // Fill Header fields
  const set = (id, val) => { const el = document.getElementById(id); if (el) el.value = val || ''; };
  set('fStoreName',   data.storeName);
  set('fStoreNameJa', data.storeNameJa);
  set('fAmountJPY',   data.amountJPY || 0);
  set('fNotes',       data.notes);
  set('fDate',        data.date || Format.today());

  // Selects
  ['fCategory', 'fPayment', 'fTaxType'].forEach(id => {
    const el = document.getElementById(id);
    const map = { fCategory: data.category, fPayment: data.paymentMethod, fTaxType: data.taxType };
    if (el && map[id]) {
      const opt = Array.from(el.options).find(o => o.value === map[id]);
      if (opt) el.value = map[id];
    }
  });

  // Items
  itemsData = Array.isArray(data.items) && data.items.length > 0 ? data.items : [];
  if (itemsData.length === 0 && (data.itemsSummary || data.items)) {
    itemsData = [{
      nameZh: typeof data.items === 'string' ? data.items : (data.itemsSummary || '商品'),
      nameJa: data.itemsJa || '',
      amountJPY: data.amountJPY || 0,
      qty: 1
    }];
  }

  renderItemsList();

  // Amount display
  updateAmountDisplay();

  // Live update on amount change
  document.getElementById('fAmountJPY').addEventListener('input', updateAmountDisplay);
  document.getElementById('btnAddItem').onclick = addItemRow;
  document.getElementById('btnSave').onclick    = save;
});

function renderItemsList() {
  const container = document.getElementById('itemsContainer');
  const settings  = Storage.getSettings();
  const rate      = settings.exchangeRate || 0.21;

  if (itemsData.length === 0) {
    container.innerHTML = `<div style="text-align:center;padding:12px;color:var(--text-muted);font-size:12px;">尚未加入品項</div>`;
    return;
  }

  container.innerHTML = itemsData.map((it, idx) => {
    const twd = Math.round((Number(it.amountJPY) || 0) * rate);
    return `
      <div style="background:var(--bg-secondary);border:1px solid var(--border-light);border-radius:var(--r-md);padding:10px 12px;position:relative;">
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;">
          <input type="text" class="form-input" style="padding:6px 10px;font-size:13px;flex:1;" placeholder="中文品名" value="${it.nameZh || ''}" onchange="updateItemField(${idx}, 'nameZh', this.value)">
          <input type="text" class="form-input" style="padding:6px 10px;font-size:12px;flex:1;color:var(--text-secondary);" placeholder="日文原文" value="${it.nameJa || ''}" onchange="updateItemField(${idx}, 'nameJa', this.value)">
          <button type="button" style="background:none;border:none;color:var(--danger);cursor:pointer;font-size:15px;padding:2px 6px;" onclick="removeItem(${idx})" title="刪除">✕</button>
        </div>
        <div style="display:flex;gap:8px;align-items:center;">
          <div style="display:flex;align-items:center;gap:4px;width:72px;">
            <span style="font-size:11px;color:var(--text-muted);">數量</span>
            <input type="number" min="1" class="form-input" style="padding:4px 6px;font-size:12px;text-align:center;" value="${it.qty || 1}" onchange="updateItemField(${idx}, 'qty', parseInt(this.value)||1)">
          </div>
          <div style="display:flex;align-items:center;gap:4px;flex:1;">
            <span style="font-size:12px;color:var(--primary);font-weight:700;">¥</span>
            <input type="number" min="0" class="form-input" style="padding:4px 8px;font-size:13px;font-weight:700;" placeholder="日幣" value="${it.amountJPY || 0}" onchange="updateItemField(${idx}, 'amountJPY', parseInt(this.value)||0)">
          </div>
          <div style="font-size:12px;color:var(--text-secondary);min-width:64px;text-align:right;">
            ≈ NT$${twd}
          </div>
        </div>
      </div>`;
  }).join('');
}

function updateItemField(idx, field, value) {
  if (itemsData[idx]) {
    itemsData[idx][field] = value;
    if (field === 'amountJPY') {
      const sumJPY = itemsData.reduce((s, it) => s + (Number(it.amountJPY) || 0), 0);
      if (sumJPY > 0) {
        document.getElementById('fAmountJPY').value = sumJPY;
        updateAmountDisplay();
      }
      renderItemsList();
    }
  }
}

function removeItem(idx) {
  itemsData.splice(idx, 1);
  renderItemsList();
}

function addItemRow() {
  itemsData.push({
    nameZh: '',
    nameJa: '',
    amountJPY: 0,
    qty: 1
  });
  renderItemsList();
}

function updateAmountDisplay() {
  const jpy      = parseInt(document.getElementById('fAmountJPY').value) || 0;
  const settings = Storage.getSettings();
  const twd      = Math.round(jpy * settings.exchangeRate);
  document.getElementById('displayJPY').textContent = jpy.toLocaleString();
  document.getElementById('displayTWD').textContent = `≈ NT$${twd.toLocaleString()}`;
  document.getElementById('twdPreview').textContent  = `NT$${twd.toLocaleString()}`;
}

function save() {
  const amountJPY = parseInt(document.getElementById('fAmountJPY').value) || 0;
  if (amountJPY <= 0) {
    showToast('請輸入金額', 'error'); return;
  }

  const settings  = Storage.getSettings();
  const rate      = settings.exchangeRate || 0.21;
  const amountTWD = Math.round(amountJPY * rate);

  // Normalize items
  const processedItems = itemsData.map(it => ({
    nameZh: it.nameZh || '商品',
    nameJa: it.nameJa || '',
    amountJPY: parseInt(it.amountJPY, 10) || 0,
    amountTWD: Math.round((parseInt(it.amountJPY, 10) || 0) * rate),
    qty: parseInt(it.qty, 10) || 1
  }));

  const itemsSummary = processedItems.length > 0
    ? processedItems.map(it => it.nameZh).join(', ')
    : '';

  const record = {
    storeName:     document.getElementById('fStoreName').value.trim()   || '（未知）',
    storeNameJa:   document.getElementById('fStoreNameJa').value.trim(),
    items:         processedItems,
    itemsSummary,
    amountJPY,
    amountTWD,
    exchangeRate:  rate,
    taxType:       document.getElementById('fTaxType').value,
    category:      document.getElementById('fCategory').value,
    paymentMethod: document.getElementById('fPayment').value,
    date:          document.getElementById('fDate').value || Format.today(),
    notes:         document.getElementById('fNotes').value.trim(),
  };

  Storage.addRecord(record);
  Session.clear('scanResult');
  showToast('✅ 記帳成功！', 'success');
  setTimeout(() => { window.location.href = 'index.html'; }, 800);
}
</script>
</body>
</html>
