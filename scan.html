<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#eceef4">
  <!-- Tells Chromium-based browsers (Samsung Internet, Chrome) that this site
       handles dark mode itself, so their auto-dark feature stops force-inverting
       the light palette. -->
  <meta name="color-scheme" content="light dark">
  <title>掃描收據 — 日本記帳</title>
  <link rel="stylesheet" href="style.css">
  <script src="js/theme.js"></script>
</head>
<body>
<div class="page">

  <!-- Header -->
  <div class="page-header">
    <a href="index.html" class="back-btn">←</a>
    <div style="flex:1;padding-left:12px;">
      <div class="page-title">📷 掃描收據</div>
      <div class="page-subtitle">拍照或上傳收據，AI 自動辨識</div>
    </div>
  </div>

  <!-- In-app browser notice (shown only inside LINE/FB/IG webviews) -->
  <div class="inapp-warn hidden" id="inAppWarn">
    <div class="inapp-warn-title">⚠️ 目前在 App 內建瀏覽器</div>
    <div class="inapp-warn-body">
      LINE、Facebook 等 App 的內建瀏覽器不允許網頁使用相機，「拍照」只會開啟圖片資料夾。<br>
      請改用 Chrome / Safari 開啟本頁，或先用手機相機拍好，再用「選圖片」上傳。
    </div>
    <div class="inapp-warn-actions">
      <button class="btn btn-secondary btn-sm" id="btnOpenExternal">用瀏覽器開啟</button>
      <button class="btn btn-secondary btn-sm" id="btnCopyLink">複製連結</button>
    </div>
  </div>

  <!-- Drop / Preview Zone -->
  <div class="scan-drop" id="dropZone">
    <div class="scan-placeholder" id="placeholder">
      <div class="scan-placeholder-icon">🧾</div>
      <div class="scan-placeholder-text">點擊選取收據照片</div>
      <div class="scan-placeholder-hint">支援 JPG、PNG、HEIC<br>建議在光線充足下拍攝，確保文字清晰</div>
    </div>
    <img id="previewImg" class="hidden" alt="收據預覽">
    <div class="scan-badge hidden" id="readyBadge">✓ 已選取</div>
  </div>

  <!-- Action Buttons -->
  <div class="scan-actions mt-12">
    <button class="btn btn-secondary" id="btnCamera">
      📷 拍照
    </button>
    <button class="btn btn-secondary" id="btnUpload">
      🖼️ 選圖片
    </button>
  </div>

  <!-- Hidden file inputs (inputCamera is only the fallback when getUserMedia
       is unavailable, e.g. non-HTTPS or an in-app webview without permission) -->
  <input type="file" id="inputCamera" accept="image/*" capture="environment" style="display:none">
  <input type="file" id="inputGallery" accept="image/*" style="display:none">

  <!-- Live camera overlay -->
  <div class="cam-overlay hidden" id="cameraView">
    <video class="cam-video" id="camVideo" playsinline autoplay muted></video>
    <div class="cam-hint">將收據放平，對準畫面後拍攝</div>
    <div class="cam-subbar">
      <button class="cam-link" id="camNative">改用手機內建相機 App</button>
    </div>
    <div class="cam-bar">
      <button class="cam-btn" id="camCancel">取消</button>
      <button class="cam-shutter" id="camShutter" aria-label="拍照"></button>
      <button class="cam-btn" id="camSwitch">切換鏡頭</button>
    </div>
  </div>

  <!-- Tips -->
  <div class="card mt-16" style="padding:14px 16px;">
    <div style="font-size:12px;font-weight:700;color:var(--text-muted);letter-spacing:1px;margin-bottom:10px;">
      💡 拍攝小技巧
    </div>
    <div style="display:flex;flex-direction:column;gap:8px;">
      <div style="display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--text-secondary);">
        <span>1.</span><span>將收據放平，避免折疊或皺摺</span>
      </div>
      <div style="display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--text-secondary);">
        <span>2.</span><span>確保收據完整出現在畫面中</span>
      </div>
      <div style="display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--text-secondary);">
        <span>3.</span><span>在充足光線下拍攝，避免反光</span>
      </div>
      <div style="display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--text-secondary);">
        <span>4.</span><span>模糊照片可能導致辨識失敗</span>
      </div>
    </div>
  </div>

  <!-- Analyze Button (hidden until image selected) -->
  <div id="analyzeWrap" class="hidden mt-16" style="padding-bottom:8px;">
    <div class="field-group">
      <div class="field-row">
        <label>AI 模型</label>
        <select class="form-input form-select" id="fModel" disabled>
          <option value="gemini-3.6-flash">gemini-3.6-flash（載入中...）</option>
        </select>
      </div>
    </div>
    <button class="btn btn-primary btn-full" id="btnAnalyze" style="font-size:17px;padding:18px;">
      🤖 開始 AI 辨識
    </button>
    <div style="text-align:center;margin-top:10px;">
      <button class="btn btn-ghost btn-sm" id="btnReset">重新選擇圖片</button>
    </div>
  </div>

</div>

<script src="js/storage.js"></script>
<script src="js/gemini.js"></script>
<script src="js/app.js"></script>
<script>
let selectedFile = null;
let compressedData = null;

document.addEventListener('DOMContentLoaded', () => {
  renderNav('scan');

  // Bind buttons
  document.getElementById('btnCamera').onclick  = openCamera;
  document.getElementById('btnUpload').onclick  = () => document.getElementById('inputGallery').click();
  document.getElementById('camShutter').onclick = takePhoto;
  document.getElementById('camCancel').onclick  = closeCamera;
  document.getElementById('camSwitch').onclick  = switchCamera;
  document.getElementById('camNative').onclick  = useNativeCamera;
  document.getElementById('btnOpenExternal').onclick = openInExternalBrowser;
  document.getElementById('btnCopyLink').onclick     = copyPageLink;

  // Warn up front rather than after a failed 拍照 tap
  if (isInAppBrowser()) document.getElementById('inAppWarn').classList.remove('hidden');
  document.getElementById('inputCamera').onchange  = e => handleFile(e.target.files[0]);
  document.getElementById('inputGallery').onchange = e => handleFile(e.target.files[0]);
  document.getElementById('btnAnalyze').onclick = analyze;
  document.getElementById('btnReset').onclick   = reset;

  // Tap on drop zone to upload
  document.getElementById('dropZone').onclick = (e) => {
    if (!selectedFile) document.getElementById('inputGallery').click();
  };
});

// ─── Live camera (getUserMedia) ────────────────────────────
// The file input's capture="environment" attribute is only a hint: desktop
// browsers ignore it and some Android pickers still show a file chooser. So
// the 拍照 button drives a real camera stream and falls back to the file
// input only when getUserMedia is unavailable or denied.
let camStream = null;
let camFacing = 'environment';
// Set once getUserMedia has failed on this device, so the next 拍照 tap goes
// straight to the system camera app instead of failing again.
let camFallback = false;

function cameraSupported() {
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
}

// LINE, Facebook, Instagram and WeChat webviews block getUserMedia outright,
// and they also ignore the file input's capture hint — so there the 拍照
// button can only ever open a picture folder. Detect them up front and point
// the user at a real browser instead of failing twice.
function isInAppBrowser() {
  return /\bLine\/|FBAN|FBAV|FB_IAB|FB4A|Instagram|MicroMessenger/i.test(navigator.userAgent);
}

function isStandalone() {
  return window.navigator.standalone === true ||
         window.matchMedia('(display-mode: standalone)').matches;
}

// Turns a getUserMedia failure into something the user can act on. An iOS
// home-screen PWA (no camera before iOS 16.4) and an in-app browser both
// report NotAllowedError, exactly like a real permission denial.
function cameraErrorHint(e) {
  switch (e.name) {
    case 'NotAllowedError':
    case 'SecurityError':
      if (isInAppBrowser()) return 'App 內建瀏覽器不允許使用相機，請改用 Chrome / Safari 開啟本頁';
      if (isStandalone())   return '從主畫面開啟時無法使用相機，請改用 Chrome / Safari 開啟網址';
      return '相機權限被拒絕，請點網址列鎖頭圖示 → 權限 → 相機 → 允許';
    case 'NotFoundError':
    case 'OverconstrainedError':
      return '找不到相機裝置，已改用系統相機';
    case 'NotReadableError':
      return '相機被其他 App 佔用，請關閉後重試';
    default:
      return '無法開啟相機（' + e.name + '），已改用系統相機';
  }
}

// LINE honours ?openExternalBrowser=1 by handing the URL to the system
// browser. Other webviews ignore it and simply reload in place, which is why
// the 複製連結 button is offered alongside.
function openInExternalBrowser() {
  const url = new URL(window.location.href);
  url.searchParams.set('openExternalBrowser', '1');
  window.location.href = url.toString();
}

async function copyPageLink() {
  const url = window.location.href.split('?')[0];
  try {
    await navigator.clipboard.writeText(url);
    showToast('連結已複製，請貼到 Chrome / Safari 開啟', 'success', 4000);
  } catch (e) {
    showToast('複製失敗，請手動複製網址列的連結', 'error', 4000);
  }
}

// Draws attention to the notice when 拍照 can't possibly work here
function flashInAppWarn() {
  const warn = document.getElementById('inAppWarn');
  warn.classList.remove('hidden');
  warn.scrollIntoView({ behavior: 'smooth', block: 'center' });
  warn.classList.add('flash');
  setTimeout(() => warn.classList.remove('flash'), 1200);
}

async function startStream() {
  stopStream();
  camStream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: camFacing }, width: { ideal: 1920 } },
    audio: false
  });
  const video = document.getElementById('camVideo');
  video.srcObject = camStream;
  await video.play().catch(() => {});
}

function stopStream() {
  if (camStream) {
    camStream.getTracks().forEach(t => t.stop());
    camStream = null;
  }
  document.getElementById('camVideo').srcObject = null;
}

async function openCamera() {
  // In LINE/FB/IG the file input only ever opens a picture folder, so don't
  // pretend otherwise — send the user to a real browser.
  if (isInAppBrowser()) {
    showToast('App 內建瀏覽器無法使用相機，請改用 Chrome / Safari', 'error', 5000);
    flashInAppWarn();
    return;
  }

  // No camera API (http:// page or a locked-down webview), or getUserMedia has
  // already failed here → go straight to the system camera app.
  if (!cameraSupported() || camFallback) {
    document.getElementById('inputCamera').click();
    return;
  }
  try {
    await startStream();
    document.getElementById('cameraView').classList.remove('hidden');
  } catch (e) {
    stopStream();
    camFallback = true;
    showToast(cameraErrorHint(e), 'error', 5000);
    // Try the system camera right away. iOS may drop this click because the
    // await consumed the user gesture — camFallback makes the next tap work.
    document.getElementById('inputCamera').click();
  }
}

function closeCamera() {
  stopStream();
  document.getElementById('cameraView').classList.add('hidden');
}

// Hands off to the phone's own camera app for anyone who prefers its UI
// (zoom, flash, HDR). Outside an in-app browser Android and iOS honour the
// capture hint and open the camera directly.
function useNativeCamera() {
  closeCamera();
  document.getElementById('inputCamera').click();
}

async function switchCamera() {
  camFacing = camFacing === 'environment' ? 'user' : 'environment';
  try {
    await startStream();
  } catch (e) {
    showToast('無法切換鏡頭', 'error');
  }
}

function takePhoto() {
  const video = document.getElementById('camVideo');
  const w = video.videoWidth, h = video.videoHeight;
  if (!w || !h) { showToast('相機還在啟動中，請稍候', 'error'); return; }

  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  canvas.getContext('2d').drawImage(video, 0, 0, w, h);
  closeCamera();

  canvas.toBlob(blob => {
    if (!blob) { showToast('拍照失敗，請重試', 'error'); return; }
    handleFile(new File([blob], `receipt-${Date.now()}.jpg`, { type: 'image/jpeg' }));
  }, 'image/jpeg', 0.92);
}

// Release the camera if the page is hidden or unloaded
document.addEventListener('visibilitychange', () => {
  if (document.hidden && camStream) closeCamera();
});
window.addEventListener('pagehide', stopStream);

async function handleFile(file) {
  if (!file) return;
  if (!file.type.startsWith('image/')) {
    showToast('請選擇圖片檔案', 'error'); return;
  }

  selectedFile = file;
  showLoading('壓縮圖片中...');

  try {
    compressedData = await Gemini.compress(file);
    // Show preview
    const img = document.getElementById('previewImg');
    img.src = compressedData.previewUrl;
    img.classList.remove('hidden');
    document.getElementById('placeholder').classList.add('hidden');
    document.getElementById('readyBadge').classList.remove('hidden');
    document.getElementById('dropZone').classList.add('has-image');
    document.getElementById('analyzeWrap').classList.remove('hidden');
    // Scroll to analyze button
    document.getElementById('analyzeWrap').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    // Fetch the live model list now that there's an image to analyze
    loadModelOptions();
  } catch (e) {
    showToast('圖片載入失敗：' + e.message, 'error');
  } finally {
    hideLoading();
  }
}

// Populates the model dropdown with the live list of available Gemini
// flash models. Always defaults the selection to gemini-2.5-flash.
async function loadModelOptions() {
  const select = document.getElementById('fModel');
  select.disabled = true;
  select.innerHTML = `<option value="${Gemini.DEFAULT_MODEL}">${Gemini.DEFAULT_MODEL}（載入中...）</option>`;

  try {
    const models = await Gemini.listModels();
    select.innerHTML = models.map(m => `<option value="${m}">${m}</option>`).join('');
    select.value = models.includes(Gemini.DEFAULT_MODEL) ? Gemini.DEFAULT_MODEL : models[0];
  } catch (e) {
    // No API key yet, or the list call failed — still let the user proceed
    // with the default model.
    select.innerHTML = `<option value="${Gemini.DEFAULT_MODEL}">${Gemini.DEFAULT_MODEL}</option>`;
    select.value = Gemini.DEFAULT_MODEL;
  } finally {
    select.disabled = false;
  }
}

async function analyze() {
  if (!requireApiKey()) return;
  if (!compressedData) { showToast('請先選擇收據圖片', 'error'); return; }

  const model = document.getElementById('fModel').value || Gemini.DEFAULT_MODEL;
  showLoading(`🤖 使用 ${model} 辨識日文收據中...`);

  try {
    // Single model, no automatic fallback: if this model fails, stop here.
    const result = await Gemini.analyzeReceipt(compressedData.base64, compressedData.mimeType, model);
    // Pass result to confirm page via sessionStorage
    Session.set('scanResult', result);
    window.location.href = 'confirm.html';
  } catch (e) {
    hideLoading();
    showToast('❌ ' + e.message, 'error', 5000);
  }
}

function reset() {
  selectedFile   = null;
  compressedData = null;
  const img = document.getElementById('previewImg');
  if (img.src) URL.revokeObjectURL(img.src);
  img.src = '';
  img.classList.add('hidden');
  document.getElementById('placeholder').classList.remove('hidden');
  document.getElementById('readyBadge').classList.add('hidden');
  document.getElementById('dropZone').classList.remove('has-image');
  document.getElementById('analyzeWrap').classList.add('hidden');
  document.getElementById('fModel').innerHTML = `<option value="${Gemini.DEFAULT_MODEL}">${Gemini.DEFAULT_MODEL}（載入中...）</option>`;
  // Reset file inputs
  document.getElementById('inputCamera').value  = '';
  document.getElementById('inputGallery').value = '';
}
</script>
</body>
</html>
