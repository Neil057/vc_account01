<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#090e1a">
  <title>歷史記錄 — 日本記帳</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <!-- Header -->
  <div class="page-header">
    <div>
      <div class="page-title">📋 記錄</div>
      <div class="page-subtitle" id="totalCount">共 0 筆記帳</div>
    </div>
    <button class="header-icon-btn" id="btnExport" title="匯出 CSV">📥</button>
  </div>

  <!-- Filter Pills -->
  <div class="pills" id="filterPills">
    <button class="pill active" data-cat="">全部</button>
    <button class="pill" data-cat="餐飲">🍱 餐飲</button>
    <button class="pill" data-cat="交通">🚆 交通</button>
    <button class="pill" data-cat="購物">🛍️ 購物</button>
    <button class="pill" data-cat="門票">🎫 門票</button>
    <button class="pill" data-cat="住宿">🏨 住宿</button>
    <button class="pill" data-cat="藥品">💊 藥品</button>
    <button class="pill" data-cat="其他">📦 其他</button>
  </div>

  <!-- Records -->
  <div id="recordsContainer"></div>

</div>

<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script>
let currentFilter = '';
let allRecords    = [];

document.addEventListener('DOMContentLoaded', () => {
  renderNav('history');

  allRecords = Storage.getRecords();
  document.getElementById('totalCount').textContent = `共 ${allRecords.length} 筆記帳`;

  // Filter pills
  document.getElementById('filterPills').addEventListener('click', e => {
    const pill = e.target.closest('.pill');
    if (!pill) return;
    currentFilter = pill.dataset.cat;
    document.querySelectorAll('.pill').forEach(p => p.classList.toggle('active', p === pill));
    renderList();
  });

  // Export
  document.getElementById('btnExport').onclick = () => Storage.exportCSV();

  renderList();
});

function renderList() {
  const container = document.getElementById('recordsContainer');

  const filtered = currentFilter
    ? allRecords.filter(r => r.category === currentFilter)
    : allRecords;

  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="empty fade-up">
        <div class="empty-icon">${currentFilter ? getCatIcon(currentFilter) : '🧾'}</div>
        <div class="empty-text">沒有${currentFilter ? ' ' + currentFilter + ' ' : ''}記錄</div>
        <div class="empty-hint">去掃描一張收據吧！</div>
      </div>`;
    return;
  }

  // Group by date
  const groups = {};
  filtered.forEach(r => {
    const d = r.date || 'unknown';
    if (!groups[d]) groups[d] = [];
    groups[d].push(r);
  });

  // Sort dates descending
  const sortedDates = Object.keys(groups).sort((a, b) => b.localeCompare(a));

  container.innerHTML = sortedDates.map(date => {
    const dayTotal = groups[date].reduce((s, r) => s + (r.amountJPY || 0), 0);
    return `
      <div class="date-group-label">
        ${Format.dateGroupLabel(date)}
        <span style="float:right;color:var(--text-secondary);font-weight:600;">
          ${Format.yen(dayTotal)}
        </span>
      </div>
      ${groups[date].map(r => renderCard(r)).join('')}
    `;
  }).join('');

  // Bind delete buttons
  container.querySelectorAll('.history-del').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const id   = btn.dataset.id;
      const card = document.getElementById('rec-' + id);
      const confirmed = await confirm2('確定要刪除這筆記錄嗎？');
      if (confirmed) {
        Storage.deleteRecord(id);
        card.style.transition = 'opacity 0.3s, transform 0.3s';
        card.style.opacity    = '0';
        card.style.transform  = 'translateX(20px)';
        setTimeout(() => {
          allRecords = Storage.getRecords();
          renderList();
          document.getElementById('totalCount').textContent = `共 ${allRecords.length} 筆記帳`;
        }, 350);
        showToast('已刪除', 'info');
      }
    });
  });
}

function renderCard(r) {
  const cat = getCat(r.category);
  return `
    <div class="history-card fade-up" id="rec-${r.id}">
      <div class="rec-icon ${cat.cls}">${cat.icon}</div>
      <div class="rec-info">
        <div class="rec-store">${r.storeName || '（未知）'}</div>
        <div class="rec-items">${r.items || '—'}</div>
        <div class="rec-meta">${r.paymentMethod || ''} · ${r.taxType || ''}</div>
      </div>
      <div class="rec-amount">
        <div class="rec-jpy">${Format.yen(r.amountJPY)}</div>
        <div class="rec-twd">${Format.twd(r.amountTWD)}</div>
      </div>
      <button class="history-del" data-id="${r.id}" title="刪除">🗑️</button>
    </div>`;
}
</script>
</body>
</html>
