<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#090e1a">
  <title>歷史記錄 — 日本記帳</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <!-- Header -->
  <div class="page-header">
    <div>
      <div class="page-title">📋 記錄</div>
      <div class="page-subtitle" id="totalCount">共 0 筆記帳</div>
    </div>
    <button class="header-icon-btn" id="btnExport" title="匯出 JSON">📥</button>
  </div>

  <!-- Filter Pills -->
  <div class="pills" id="filterPills">
    <button class="pill active" data-cat="">全部</button>
    <button class="pill" data-cat="餐飲">🍱 餐飲</button>
    <button class="pill" data-cat="交通">🚆 交通</button>
    <button class="pill" data-cat="購物">🛍️ 購物</button>
    <button class="pill" data-cat="門票">🎫 門票</button>
    <button class="pill" data-cat="住宿">🏨 住宿</button>
    <button class="pill" data-cat="藥品">💊 藥品</button>
    <button class="pill" data-cat="其他">📦 其他</button>
  </div>

  <!-- Records -->
  <div id="recordsContainer"></div>

</div>

<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script>
let currentFilter = '';
let allRecords    = [];

document.addEventListener('DOMContentLoaded', () => {
  renderNav('history');

  allRecords = Storage.getRecords();
  document.getElementById('totalCount').textContent = `共 ${allRecords.length} 筆記帳`;

  // Filter pills
  document.getElementById('filterPills').addEventListener('click', e => {
    const pill = e.target.closest('.pill');
    if (!pill) return;
    currentFilter = pill.dataset.cat;
    document.querySelectorAll('.pill').forEach(p => p.classList.toggle('active', p === pill));
    renderList();
  });

  // Export
  document.getElementById('btnExport').onclick = () => Storage.exportJSON();

  renderList();
});

function renderList() {
  const container = document.getElementById('recordsContainer');

  const filtered = currentFilter
    ? allRecords.filter(r => r.category === currentFilter)
    : allRecords;

  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="empty fade-up">
        <div class="empty-icon">${currentFilter ? getCatIcon(currentFilter) : '🧾'}</div>
        <div class="empty-text">沒有${currentFilter ? ' ' + currentFilter + ' ' : ''}記錄</div>
        <div class="empty-hint">去掃描一張收據吧！</div>
      </div>`;
    return;
  }

  // Group by date
  const groups = {};
  filtered.forEach(r => {
    const d = r.date || 'unknown';
    if (!groups[d]) groups[d] = [];
    groups[d].push(r);
  });

  // Sort dates descending
  const sortedDates = Object.keys(groups).sort((a, b) => b.localeCompare(a));

  container.innerHTML = sortedDates.map(date => {
    const dayTotal = groups[date].reduce((s, r) => s + (r.amountJPY || 0), 0);
    return `
      <div class="date-group-label">
        ${Format.dateGroupLabel(date)}
        <span style="float:right;color:var(--text-secondary);font-weight:600;">
          ${Format.yen(dayTotal)}
        </span>
      </div>
      ${groups[date].map(r => renderCard(r)).join('')}
    `;
  }).join('');

  // Bind accordion click
  container.querySelectorAll('.history-card').forEach(card => {
    card.addEventListener('click', (e) => {
      if (e.target.closest('.history-del')) return;
      const wrap = card.closest('.history-item-wrap');
      wrap.classList.toggle('open');
    });
  });

  // Bind delete buttons
  container.querySelectorAll('.history-del').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const id   = btn.dataset.id;
      const wrap = document.getElementById('rec-' + id);
      const confirmed = await confirm2('確定要刪除這筆記錄嗎？');
      if (confirmed) {
        Storage.deleteRecord(id);
        wrap.style.transition = 'opacity 0.3s, transform 0.3s';
        wrap.style.opacity    = '0';
        wrap.style.transform  = 'translateX(20px)';
        setTimeout(() => {
          allRecords = Storage.getRecords();
          renderList();
          document.getElementById('totalCount').textContent = `共 ${allRecords.length} 筆記帳`;
        }, 350);
        showToast('已刪除', 'info');
      }
    });
  });
}

function renderCard(r) {
  const cat = getCat(r.category);
  const itemsList = Array.isArray(r.items) ? r.items : [];
  const itemsSummary = itemsList.length > 0
    ? itemsList.map(it => it.nameZh).join(', ')
    : (typeof r.items === 'string' ? r.items : (r.itemsSummary || '—'));

  // Build items rows for detail table
  let itemsTableHtml = '';
  if (itemsList.length > 0) {
    itemsTableHtml = `
      <div class="detail-table-title">
        <span>📋 收據品項明細（${itemsList.length} 項）</span>
      </div>
      <table class="items-table">
        <thead>
          <tr>
            <th>品項名稱（中 / 日）</th>
            <th style="width:36px;text-align:center;">數量</th>
            <th class="num-col">金額</th>
          </tr>
        </thead>
        <tbody>
          ${itemsList.map(it => `
            <tr>
              <td>
                <div class="item-zh">${it.nameZh || '商品'}</div>
                ${it.nameJa ? `<div class="item-ja">${it.nameJa}</div>` : ''}
              </td>
              <td style="text-align:center;color:var(--text-secondary);font-size:12px;">×${it.qty || 1}</td>
              <td class="num-col">
                <div class="item-jpy">${Format.yen(it.amountJPY)}</div>
                <div class="item-twd">${Format.twd(it.amountTWD)}</div>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  } else {
    itemsTableHtml = `
      <div style="padding:10px 0;font-size:13px;color:var(--text-secondary);">
        品項：${itemsSummary}
      </div>
    `;
  }

  return `
    <div class="history-item-wrap fade-up" id="rec-${r.id}">
      <div class="history-card">
        <div class="rec-icon ${cat.cls}">${cat.icon}</div>
        <div class="rec-info">
          <div class="rec-store">${r.storeName || '（未知店名）'}</div>
          <div class="rec-items">${itemsSummary}</div>
          <div class="rec-meta">${r.paymentMethod || '現金'} · ${r.taxType || '内税'} · 點擊展開明細 ▾</div>
        </div>
        <div class="rec-amount">
          <div class="rec-jpy">${Format.yen(r.amountJPY)}</div>
          <div class="rec-twd">${Format.twd(r.amountTWD)}</div>
        </div>
        <button class="history-del" data-id="${r.id}" title="刪除">🗑️</button>
        <span class="history-chevron">▼</span>
      </div>

      <!-- Expandable Detail Panel -->
      <div class="history-detail-panel">
        <div class="detail-meta-grid">
          <div class="detail-meta-item">
            <span class="detail-meta-label">日文店名</span>
            <span class="detail-meta-val">${r.storeNameJa || '—'}</span>
          </div>
          <div class="detail-meta-item">
            <span class="detail-meta-label">支付與稅制</span>
            <span class="detail-meta-val">${r.paymentMethod || '現金'} (${r.taxType || '内税'})</span>
          </div>
          <div class="detail-meta-item">
            <span class="detail-meta-label">消費類別</span>
            <span class="detail-meta-val">${cat.icon} ${r.category || '其他'}</span>
          </div>
          <div class="detail-meta-item">
            <span class="detail-meta-label">備註</span>
            <span class="detail-meta-val">${r.notes || '無'}</span>
          </div>
        </div>

        ${itemsTableHtml}
      </div>
    </div>`;
}
</script>
</body>
</html>
